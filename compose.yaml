name: autogestion

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    volumes:
      # Los datos viven en una carpeta del disco local, fuera del contenedor
      - ${DATOS_POSTGRES:-./datos/postgres}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PUERTO:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_USUARIO: ${AUTH_USUARIO:?Ejecuta npm run auth:configurar}
      AUTH_CLAVE_HASH: ${AUTH_CLAVE_HASH:?Ejecuta npm run auth:configurar}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Ejecuta npm run auth:configurar}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Ejecuta npm run auth:configurar}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PUERTO:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
